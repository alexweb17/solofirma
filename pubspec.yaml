name: solofirma
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  # Rango de SDK actualizado para ser compatible con Flutter moderno
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Versiones actualizadas y compatibles de todos los paquetes
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.6 
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  share_plus: ^11.0.0
  # VERSIÓN FINAL Y ACTUALIZADA - ESTA ES LA SOLUCIÓN
  syncfusion_flutter_pdf: ^30.1.42
  syncfusion_flutter_pdfviewer: ^30.1.42
  qr_flutter: ^4.1.0
  receive_sharing_intent: ^1.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0 # Versión actualizada

flutter:
  # CORRECCIÓN: Se añadieron dos espacios para la indentación correcta.
  uses-material-design: true

# CORRECCIÓN: Se añadió una línea en blanco al final del archivo.
# Logo de solofirma
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
# Logo splash
flutter_native_splash:
  color: "#FFFFFF" # Fondo blanco
  image: assets/logo.png
  android: true
  ios: true