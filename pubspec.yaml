name: solofirma
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Versiones actualizadas y compatibles de todos los paquetes
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.6
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.3
  share_plus: ^11.0.0
  x509: ^0.2.4
  asn1lib: ^1.5.0
  basic_utils: ^5.7.0
  syncfusion_flutter_pdf: ^31.1.19
  syncfusion_flutter_pdfviewer: ^31.1.19
  qr_flutter: ^4.1.0
  receive_sharing_intent: ^1.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.0
  provider: ^6.1.5

  # ***** PAQUETES NUEVOS PARA MONETIZACIÓN *****
  shared_preferences: ^2.5.3
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # Versión actualizada
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/

# Logo de solofirma
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

# Logo splash
flutter_native_splash:
  color: "#FFFFFF" # Fondo blanco
  image: assets/logo.png
  android: true
  ios: true